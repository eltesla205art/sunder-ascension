  </defs>

  <!-- Falcon wings (Horus motif) -->
  <path d="M32 30 L4 40 L2 52 L18 46 L14 58 L26 50 Z" fill="url(#darkgold)" stroke="#3a2c05" stroke-width="1"/>
  <path d="M32 30 L60 40 L62 52 L46 46 L50 58 L38 50 Z" fill="url(#darkgold)" stroke="#3a2c05" stroke-width="1"/>

  <!-- Wing gold edges -->
  <path d="M32 32 L10 40 L20 44 Z" fill="url(#gold)"/>
  <path d="M32 32 L54 40 L44 44 Z" fill="url(#gold)"/>

  <!-- Central fuselage - obelisk shape -->
