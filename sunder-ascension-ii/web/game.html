   3. Enemy bullets deal 1; boss bullets deal 2 from Hour 7 (of 12); boss contact deals 2.

   4. Stages are 1.6x longer and drop 4% more pickups    -> time to level up before the boss.

function artReady(k){ const im = ART[k]; return !!(im && im.complete && im.naturalWidth); }

const TINT_CACHE = {};
function tintedSprite(key, tint, alpha) {
  const a = alpha === undefined ? 0.45 : alpha;
  const ck = key + '|' + tint + '|' + a;
  if (TINT_CACHE[ck]) return TINT_CACHE[ck];
  const im = IMGS[key];
  if (!im || !im.complete || !im.naturalWidth) return im;
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const x = c.getContext('2d');
  x.drawImage(im, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.globalAlpha = a;
  x.fillStyle = tint;
  x.fillRect(0, 0, c.width, c.height);
  TINT_CACHE[ck] = c;
  return c;
}

function makePlayer(shipIdx) {

  return { ship: s, x: W/2, y: H-90,
           hp: s.max_health, maxHp: s.max_health,
           bombs: s.bombs, speed: s.speed, fireRate: s.fire_rate,

           fireCd: 0, inv: false, invT: 0, r: 9, formFlash: 0 };  // r 9: hurtbox smaller than sprite (fair-arcade rule)
}

}

/* ============================== STARFIELD (3-layer parallax, Cosmic Strike update) ============================== */
const stars = [];
(function initStars(){
  const layers = [
    { n: 42, spMin: 18,  spMax: 55,  szMin: 0.6, szMax: 1.3, a: 0.35 },  // far
    { n: 34, spMin: 70,  spMax: 130, szMin: 1.0, szMax: 2.2, a: 0.65 },  // mid
    { n: 20, spMin: 150, spMax: 250, szMin: 1.8, szMax: 3.2, a: 1.0  },  // near
  ];
  for (const L of layers)
    for (let i = 0; i < L.n; i++) stars.push({
      x: Math.random()*W, y: Math.random()*H,
      speed: L.spMin + Math.random()*(L.spMax - L.spMin),
      size: L.szMin + Math.random()*(L.szMax - L.szMin),
      alpha: L.a, gold: Math.random() < 0.3 });
})();
function updateStars(dt){
  for (const s of stars){ s.y += s.speed*dt; if (s.y > H){ s.y = 0; s.x = Math.random()*W; } }
}

/* ============================== AUDIO: SFX + MUSIC ============================== */
let AC = null, sfxOn = true, lastShotSfx = 0, musicMuted = false;
function ac(){ if (!IS_BROWSER) return null;
  if (!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ sfxOn=false; } }
  return AC; }
function sfx(kind){
  if (!IS_BROWSER || !sfxOn) return;
  const a = ac(); if (!a) return;
  if (a.state === 'suspended') a.resume();
  const t = a.currentTime;
  if (kind === 'shoot'){ if (t - lastShotSfx < 0.09) return; lastShotSfx = t; }
  const o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination);
  switch(kind){
    case 'shoot':   o.type='square';   o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(440,t+0.07); g.gain.setValueAtTime(0.025,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08); o.start(t); o.stop(t+0.09); break;
    case 'boom':    o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(40,t+0.3);  g.gain.setValueAtTime(0.11,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.32); o.start(t); o.stop(t+0.33); break;
    case 'bigboom': o.type='sawtooth'; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(28,t+0.8);  g.gain.setValueAtTime(0.2,t);  g.gain.exponentialRampToValueAtTime(0.001,t+0.85); o.start(t); o.stop(t+0.86); break;
    case 'hit':     o.type='triangle'; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(90,t+0.15); g.gain.setValueAtTime(0.1,t);  g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.start(t); o.stop(t+0.17); break;
    case 'power':   o.type='sine';     o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(1040,t+0.18); g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.start(t); o.stop(t+0.21); break;
    case 'life':    o.type='sine';     o.frequency.setValueAtTime(660,t); o.frequency.exponentialRampToValueAtTime(990,t+0.25); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.start(t); o.stop(t+0.29); break;
    case 'bomb':    o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(30,t+0.5);  g.gain.setValueAtTime(0.17,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.55); o.start(t); o.stop(t+0.56); break;
    case 'select':  o.type='square';   o.frequency.setValueAtTime(440,t); o.frequency.setValueAtTime(660,t+0.06); g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14); o.start(t); o.stop(t+0.15); break;
  }
}
/* Procedural chiptune music: main (heroic loop), boss (tense loop), victory (sting). */
const NOTE = n => 440 * Math.pow(2, (n-69)/12);  // MIDI -> Hz
const MUSIC_PATTERNS = {
  main: { bpm: 104, loop: true,
    bass:  [45,45,52,45, 48,48,52,45, 45,45,52,45, 50,50,52,55],       // A2-ish heroic
    lead:  [69,0,72,76, 0,74,72,0, 69,0,72,76, 79,0,77,74] },
  boss: { bpm: 148, loop: true,
    bass:  [41,41,41,47, 41,41,41,46, 41,41,41,47, 41,44,46,47],
    lead:  [0,65,0,68, 0,65,71,0, 0,65,0,68, 72,0,71,68] },
  victory: { bpm: 120, loop: false,
    bass:  [45,52,57,57],
    lead:  [69,73,76,81] },
};
const Music = { current: null, timer: null, step: 0, nextT: 0 };
function music(kind){
  if (!IS_BROWSER || musicMuted) { Music.current = kind; return; }
  if (Music.current === kind && Music.timer) return;
  Music.current = kind;
  const a = ac(); if (!a) return;
  stopMusicTimer();
  const pat = MUSIC_PATTERNS[kind];
  if (!pat) return;
  Music.step = 0;
  Music.nextT = a.currentTime + 0.08;
  const stepDur = 60 / pat.bpm / 2;   // 8th notes
  Music.timer = setInterval(() => {
    const now = a.currentTime;
    while (Music.nextT < now + 0.12){
      const i = Music.step % pat.bass.length;
      scheduleNote(a, pat.bass[i], Music.nextT, stepDur*0.9, 'triangle', 0.05);
      if (pat.lead[i]) scheduleNote(a, pat.lead[i], Music.nextT, stepDur*0.8, 'square', 0.028);
      Music.step++;
      Music.nextT += stepDur;
      if (!pat.loop && Music.step >= pat.bass.length){ stopMusicTimer(); return; }
    }
  }, 40);
}
function scheduleNote(a, midi, t, dur, type, vol){
  if (!midi) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = NOTE(midi);
  o.connect(g); g.connect(a.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function stopMusicTimer(){ if (Music.timer){ clearInterval(Music.timer); Music.timer = null; } }
function toggleMute(){
  musicMuted = !musicMuted;
  if (musicMuted) stopMusicTimer();
  else { const cur = Music.current; Music.current = null; music(cur || 'main'); }
}

/* ============================== PARTICLES ============================== */
function explode(x, y, color, n, big){
  for (let i = 0; i < n; i++){
    const a = Math.random()*TAU, sp = (big?60:30) + Math.random()*(big?260:150);
    G.particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.35 + Math.random()*(big?0.7:0.35), t: 0, size: 1.5+Math.random()*(big?4:2.5), color });
  }
}
function updateParticles(dt){
  for (let i = G.particles.length-1; i >= 0; i--){
    const p = G.particles[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.98; p.vy *= 0.98;
    if (p.t >= p.life) G.particles.splice(i,1);
  }
}

function enemyKilled(e){

/* ============================== PLAYER ============================== */
function spawnPlayerBullet(x, y, vx, vy, dmg, sc){
  // BATTLE MATH #1: damage scales with power level
  G.pBullets.push({ x, y, vx, vy,
    dmg: (dmg + (G.player.weapon === 'blue' ? 1 : 0)) * G.player.power,
    color: G.player.weapon, r: 6 * (sc || 1), scale: sc || 1 });
}
function shootStyle(p){
  if (p.style === 'twin_spread'){
    const angles = p.power === 1 ? [-6,6] : (p.power === 2 ? [-10,0,10] : [-16,-5,5,16]);
    for (const a of angles){
      const rad = (a - 90) * D2R;
      spawnPlayerBullet(p.x, p.y-30, Math.cos(rad)*640, Math.sin(rad)*640, p.baseDmg, 1);
    }
  } else if (p.style === 'heavy_cannon'){
    const offs = p.power === 1 ? [0] : (p.power === 2 ? [-14,14] : [-18,0,18]);
    for (const o of offs)
      spawnPlayerBullet(p.x+o, p.y-30, 0, -560, p.baseDmg+1, 1.6);
  } else { // rapid_stream
    const offs = p.power === 1 ? [0] : (p.power === 2 ? [-8,8] : [-12,0,12]);
    for (const o of offs)
      spawnPlayerBullet(p.x+o, p.y-30, 0, -780, p.baseDmg, 0.8);
  }
}
function useBomb(){
  const p = G.player;
  if (p.bombs <= 0) return;
  p.bombs--;
  G.eBullets.length = 0;
  for (let i = G.enemies.length-1; i >= 0; i--){
    const e = G.enemies[i];
    e.hp -= 8;
    if (e.hp <= 0){ enemyKilled(e); G.enemies.splice(i,1); }
    else e.flash = 0.12;
  }
  if (G.boss && !G.boss.entering) bossTakeDamage(10);
  G.shake = 0.4;
  explode(p.x, p.y-100, '#8FE3FF', 60, true);
  sfx('bomb');
}
function collectPowerup(kind){
  const p = G.player;
  const before = p.power;
  if (kind === 'red' || kind === 'blue'){
    if (p.weapon === kind) p.power = Math.min(p.power+1, 3);
    else p.weapon = kind;                     // switching keeps power (Sunder rules)
    sfx('power');
  } else if (kind === 'power'){
    p.power = Math.min(p.power+1, 3);
    sfx('power');
  } else if (kind === 'life'){
    p.hp = Math.min(p.hp + 1, p.maxHp + 2);   // overheal cap +2
    sfx('life');
  } else if (kind === 'shield'){
    p.shield = Math.min(p.shield + 1, 3);
    sfx('life');
  } else if (kind === 'bomb'){
    p.bombs = Math.min(p.bombs + 1, 9);
    sfx('power');
  }
  if (p.power !== before){
    p.formFlash = 0.4;
    const fname = p.ship.form_names[Math.min(p.power-1, p.ship.form_names.length-1)];
    G.toast = 'FORM: ' + fname.toUpperCase();
    G.toastT = 2.2;
    explode(p.x, p.y, p.ship.accent, 24);
  }
}
function playerTakeDamage(amount){
  const p = G.player;
  if (p.inv) return;
  const dmg = amount || 1;
  if (p.shield > 0){
    // shield absorbs the ENTIRE hit: no hull loss, no power loss
    p.shield -= 1;
    p.inv = true; p.invT = 0.8;
    explode(p.x, p.y, '#8FE3FF', 18);
    sfx('hit');
    G.shake = Math.max(G.shake, 0.15);
    return;
  }
  p.hp -= dmg;
  if (p.power > 1){
    p.power -= 1;   // form de-evolves
    const fname = p.ship.form_names[Math.min(p.power-1, p.ship.form_names.length-1)];
    G.toast = 'FORM: ' + fname.toUpperCase();
    G.toastT = 1.6;
  }
  sfx('hit');
  G.shake = Math.max(G.shake, 0.25);
  if (p.hp <= 0){ onPlayerDied(); }
  else { p.inv = true; p.invT = 1.15; explode(p.x, p.y, '#FFD54A', 20); }
}
function updatePlayer(dt){
  const p = G.player;
  if (!G.playerAlive) return;
  let dx = (input.right?1:0) - (input.left?1:0);
  let dy = (input.down?1:0) - (input.up?1:0);
  if (input.touchActive){
    p.x += input.touchDX; p.y += input.touchDY;
    input.touchDX = 0; input.touchDY = 0;
  } else {
    const len = Math.hypot(dx, dy);
    if (len > 1){ dx /= len; dy /= len; }
    p.x += dx * p.speed * dt;
    p.y += dy * p.speed * dt;
  }
  p.x = Math.max(24, Math.min(W-24, p.x));
  p.y = Math.max(24, Math.min(H-24, p.y));

  if (p.inv){ p.invT -= dt; if (p.invT <= 0) p.inv = false; }
  if (p.formFlash > 0) p.formFlash -= dt;

  // engine trail (Cosmic Strike juice): gold->ember thruster particles
  if (G.playerVisible && Math.random() < 0.85)
    G.particles.push({
      x: p.x + (Math.random()-0.5)*7, y: p.y + 30,
      vx: (Math.random()-0.5)*35, vy: 130 + Math.random()*90,
      life: 0.25 + Math.random()*0.18, t: 0,
      size: 1.4 + Math.random()*2.1,
      color: Math.random() < 0.55 ? '#FFD54A' : '#FF5E2E' });

  p.fireCd -= dt;
  const wantFire = input.fire || input.touchActive;
  if (wantFire && p.fireCd <= 0 && (G.state === 'PLAYING' || G.state === 'BOSS_INTRO')){
    shootStyle(p);
    p.fireCd = p.fireRate * (p.weapon === 'blue' ? 0.85 : 1.0);
    sfx('shoot');
  }
  if (bombPressed && (G.state === 'PLAYING' || G.state === 'BOSS_INTRO')) useBomb();
}

/* ============================== ENEMIES ============================== */
function updateEnemies(dt){
  for (let i = G.enemies.length-1; i >= 0; i--){
    const e = G.enemies[i];
    const prevTime = e.time;
    e.time += dt;
    if (e.flash > 0) e.flash -= dt;
    switch (e.move){
      case 'dive':   e.y += e.speed*dt; break;
      case 'weave':  e.y += e.speed*dt; e.x = e.baseX + Math.sin(e.time*2 + e.phaseOff)*90; break;
      case 'rush':   e.y += e.speed*1.4*dt; break;
      case 'zigzag': e.y += e.speed*dt; e.x += Math.sin(e.time*6 + e.phaseOff)*140*dt; break;
      case 'circle': e.y += e.speed*0.7*dt; e.x = e.baseX + Math.cos(e.time*2.5 + e.phaseOff)*110; break;
      case 'formation': e.y += e.speed*dt; e.x = e.baseX + Math.sin(e.time*1.2)*40; break;
      case 'evade':
        e.y += e.speed*dt;
        if (Math.floor(e.time/0.8) !== Math.floor(prevTime/0.8)) e.evadeDir *= -1;
        e.x += e.evadeDir * e.speed * 0.8 * dt;
        e.x = Math.max(30, Math.min(W-30, e.x));
        break;
    }
    e.fireTimer -= dt;
    if (e.fireTimer <= 0){
      e.fireTimer = e.fireInterval;
      let dirX = 0, dirY = 1;
      if (G.playerAlive){
        const ddx = G.player.x - e.x, ddy = G.player.y - e.y;
        const L = Math.hypot(ddx, ddy) || 1;
        dirX = ddx/L; dirY = ddy/L;
      }
      if (e.kind === 'bomber'){
        // heavy bomber: 3-way aimed spread (still weaker than a boss: dmg 1)
        const base = Math.atan2(dirY, dirX);
        for (const off of [-18, 0, 18]){
          const a = base + off*D2R;
          G.eBullets.push({ x: e.x, y: e.y+26, vx: Math.cos(a)*e.bulletSpeed, vy: Math.sin(a)*e.bulletSpeed, r: 6, dmg: 1 });
        }
      } else {
        G.eBullets.push({ x: e.x, y: e.y+22, vx: dirX*e.bulletSpeed, vy: dirY*e.bulletSpeed, r: 6, dmg: 1 });
        if (e.move === 'formation' || e.move === 'rush'){
          const a = Math.atan2(dirY, dirX) + 12*D2R;
          G.eBullets.push({ x: e.x, y: e.y+22, vx: Math.cos(a)*e.bulletSpeed, vy: Math.sin(a)*e.bulletSpeed, r: 6, dmg: 1 });
        }
      }
    }
    if (e.y > H+50 || e.x < -60 || e.x > W+60) G.enemies.splice(i,1);
  }
}

/* ============================== BOSS ============================== */
function bossSpawnBullet(x, y, vx, vy){
  // BATTLE MATH #3: boss shots outclass enemy shots in the late campaign
  G.eBullets.push({ x, y, vx, vy, r: 6, dmg: (G.mode !== 'swarm' && G.cfg.num >= 7) ? 2 : 1 });
}
function bossFirePattern(b){
  const spawn = (vx, vy) => bossSpawnBullet(b.x, b.y+20, vx, vy);
  const pat = b.patterns.length ? b.patterns[b.patternIdx % b.patterns.length] : 'radial_burst';
  const s = b.bulletSpeed;
  switch (pat){
    case 'aimed_volley': {
      if (!G.playerAlive) break;
      const base = Math.atan2(G.player.y - b.y, G.player.x - b.x);
      for (let i = -1; i <= 1; i++)
        spawn(Math.cos(base + 14*i*D2R)*s, Math.sin(base + 14*i*D2R)*s);
      break; }
    case 'spread_fan': {
      const count = 5 + b.phase*2;
      for (let i = 0; i < count; i++){
        const t = i/(count-1) - 0.5;
        const a = 90*D2R + 70*D2R*t;
        spawn(Math.cos(a)*s, Math.sin(a)*s);
      }
      break; }
    case 'horizontal_sweep': {
      const side = (b.time % 2) < 1 ? 1 : -1;
      for (let i = 0; i < 6; i++) spawn(side*s, 40 + i*25);
      break; }
    case 'radial_burst': {
      const count = 14 + b.phase*3;
      for (let i = 0; i < count; i++){
        const a = TAU*i/count;
        spawn(Math.cos(a)*s*0.85, Math.sin(a)*s*0.85);
      }
      break; }
    case 'cross_ring': {
      for (let i = 0; i < 12; i++){
        const a = TAU*i/12;
        spawn(Math.cos(a)*s*0.85, Math.sin(a)*s*0.85);
      }
      for (const deg of [0,90,180,270]){
        const a = deg*D2R + b.time;
        spawn(Math.cos(a)*s, Math.sin(a)*s);
      }
      break; }
    case 'spiral': {
      b.spiralAngle += 0.4;
      for (let i = 0; i < 3; i++){
        const a = b.spiralAngle + TAU*i/3;
        spawn(Math.cos(a)*s, Math.sin(a)*s);
      }
      break; }
    case 'wall_barrage': {
      const gap = Math.floor(Math.random()*6);
      for (let i = 0; i < 8; i++){
        if (i === gap || i === gap+1) continue;
        bossSpawnBullet(60 + i*50, b.y+20, 0, s);
      }
      break; }
    case 'dual_spiral': {
      b.spiralAngle += 0.5;
      for (let i = 0; i < 2; i++){
        const a = (i === 0 ? b.spiralAngle : -b.spiralAngle) + Math.PI*i;
        spawn(Math.cos(a)*s, Math.sin(a)*s);
      }
      break; }
    default: {
      for (let i = 0; i < 14; i++){
        const a = TAU*i/14;
        spawn(Math.cos(a)*s*0.85, Math.sin(a)*s*0.85);
      }
    }
  }
  b.fireTimer = b.fireRate * (1 - b.phase*0.12);
}
function bossTakeDamage(dmg){
  const b = G.boss;
  if (!b || b.entering) return;
  b.hp -= dmg;
  b.flash = 0.1;
  if (b.hp <= 0) onBossDefeated();
}
function updateBoss(dt){
  const b = G.boss;
  if (!b) return;
  b.time += dt;
  if (b.flash > 0) b.flash -= dt;
  if (b.entering){
    b.y += 80*dt;
    if (b.y >= b.targetY){ b.y = b.targetY; b.entering = false; }
    return;
  }
  const pct = b.hp / b.maxHp;
  b.phase = pct <= 0.33 ? 3 : (pct <= 0.66 ? 2 : 1);
  const sp = b.moveSpeed + b.phase*25;
  // phase 3: rapid-dash strafing (Cosmic Strike boss PHASE_TWO behavior)
  const dashMult = b.phase === 3 ? 1 + Math.abs(Math.cos(b.time*5)) * 1.2 : 1;
  b.x += b.dir * sp * dashMult * dt;
  if (b.x < 100){ b.x = 100; b.dir = 1; }
  else if (b.x > W-100){ b.x = W-100; b.dir = -1; }

  b.patternSwitch -= dt;
  if (b.patternSwitch <= 0){
    b.patternIdx = (b.patternIdx + 1) % Math.max(b.patterns.length, 1);
    b.patternSwitch = 3.5;
  }
  b.fireTimer -= dt;
  if (b.fireTimer <= 0) bossFirePattern(b);
}

/* ============================== BULLETS / POWERUPS / COLLISIONS ============================== */
function updateBullets(dt){
  for (let i = G.pBullets.length-1; i >= 0; i--){
    const p = G.pBullets[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.y < -30 || p.y > H+30 || p.x < -30 || p.x > W+30){ G.pBullets.splice(i,1); continue; }
    let hit = false;
    for (let j = G.enemies.length-1; j >= 0; j--){
      const e = G.enemies[j];
      if (Math.hypot(p.x-e.x, p.y-e.y) < p.r + e.r){
        e.hp -= p.dmg; e.flash = 0.12; hit = true;
        if (e.hp <= 0){ enemyKilled(e); G.enemies.splice(j,1); }
        break;
      }
    }
    if (!hit && G.boss && !G.boss.entering){
      const b = G.boss;
      if (Math.hypot(p.x-b.x, p.y-b.y) < p.r + b.r){
        bossTakeDamage(p.dmg); hit = true;
      }
    }
    if (hit) G.pBullets.splice(i,1);
  }
  for (let i = G.eBullets.length-1; i >= 0; i--){
    const b = G.eBullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.y > H+30 || b.y < -30 || b.x < -30 || b.x > W+30){ G.eBullets.splice(i,1); continue; }
    if (G.playerAlive && !G.player.inv &&
        Math.hypot(b.x-G.player.x, b.y-G.player.y) < b.r + G.player.r){
      G.eBullets.splice(i,1);
      playerTakeDamage(b.dmg || 1);
    }
  }
}
function updatePowerups(dt){
  for (let i = G.powerups.length-1; i >= 0; i--){
    const u = G.powerups[i];
    u.y += u.fallSpeed*dt;
    u.x += Math.sin(u.y*0.04)*0.6;
    if (u.y > H+40){ G.powerups.splice(i,1); continue; }
    if (G.playerAlive && Math.hypot(u.x-G.player.x, u.y-G.player.y) < u.r + G.player.r + 8){
      collectPowerup(u.kind);
      G.powerups.splice(i,1);
    }
  }
}
function checkPlayerEnemyCollisions(){
  if (!G.playerAlive || G.player.inv) return;
  for (const e of G.enemies){
    if (Math.hypot(e.x-G.player.x, e.y-G.player.y) < e.r + G.player.r){
      playerTakeDamage(1);
      return;
    }
  }
  if (G.boss && !G.boss.entering &&
      Math.hypot(G.boss.x-G.player.x, G.boss.y-G.player.y) < G.boss.r + G.player.r){
    playerTakeDamage(2);   // ramming a boss hurts twice as much as an enemy
  }
}

/* ============================== MAIN UPDATE ============================== */
function updateWorld(dt){
  updatePlayer(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateBullets(dt);
  updatePowerups(dt);
  checkPlayerEnemyCollisions();
  updateParticles(dt);
}
function update(dt){
  firePressed = input.fire && !prevFire;
  bombPressed = input.bomb && !prevBomb;
  leftPressed = input.left && !prevLeft;
  rightPressed = input.right && !prevRight;
  const mutePressed = input.muteToggle && !prevMute;
  pausePressed = input.pauseToggle && !prevPause;
  upPressed = input.up && !prevUp;
  downPressed = input.down && !prevDown;
  leadPressed = input.lead && !prevLead;
  prevFire = input.fire; prevBomb = input.bomb;
  prevLeft = input.left; prevRight = input.right; prevMute = input.muteToggle;
  prevPause = input.pauseToggle;
  prevUp = input.up; prevDown = input.down; prevLead = input.lead;
  while (touchPulse.length){ const k = touchPulse.pop(); input[k] = false; prevFire = (k === 'fire') ? false : prevFire;
    if (k === 'lead') prevLead = false; if (k === 'bomb') prevBomb = false;
    if (k === 'left') prevLeft = false; if (k === 'right') prevRight = false;
    if (k === 'up') prevUp = false; if (k === 'down') prevDown = false; }
  if (mutePressed) toggleMute();

  // pause system (playtest correction: pause button)
  const inCombat = G.state === 'PLAYING' || G.state === 'BOSS_INTRO';
  if (pausePressed && inCombat) G.paused = !G.paused;
  if (G.paused){
    if (!inCombat) G.paused = false;           // never stick outside combat
    else if (firePressed) G.paused = false;    // fresh SPACE press also resumes
    else return;                               // frozen frame: nothing moves
  }

  G.time += dt;
  updateStars(dt);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.toastT > 0) G.toastT -= dt;

  switch (G.state){
    case 'TITLE':
      if (firePressed){ G.state = 'SHIP_SELECT'; sfx('select'); music('main'); }
      if (leadPressed){ fetchScoresRemote(); G.state = 'LEADERBOARD'; }
      break;
    case 'SHIP_SELECT':
      if (leftPressed){ G.shipIndex = (G.shipIndex - 1 + SHIPS.length) % SHIPS.length; sfx('select'); }
      if (rightPressed){ G.shipIndex = (G.shipIndex + 1) % SHIPS.length; sfx('select'); }
      if (upPressed || downPressed){ G.modeSel = 1 - G.modeSel; sfx('select'); }
      if (firePressed){ if (G.modeSel === 1) startSwarm(); else launchCampaign(); }
      break;
    case 'OPENING':
      if (firePressed){ G.nextStage = 0; G.state = 'MAP'; }   // story mode travels the star map
      break;
    case 'MAP':
      if (firePressed) beginStage(G.nextStage);
      break;
    case 'BRIEFING':
      if (firePressed) startPlaying();
      break;
    case 'STAGE_CLEAR':
      if (firePressed){ G.nextStage = G.stageIndex + 1; G.state = 'MAP'; }
      break;
    case 'VICTORY':
      if (firePressed){ startEnterScore(); }
      updateParticles(dt);
      break;
    case 'DEFEAT':
      if (firePressed){ if (G.mode === 'swarm') startSwarm(); else launchCampaign(); }
      if (leadPressed){ startEnterScore(); }
      updateParticles(dt);
      break;
    case 'ENTER_SCORE':
      if (leftPressed){ G.slot = (G.slot + 2) % 3; sfx('select'); }
      if (rightPressed){ G.slot = (G.slot + 1) % 3; sfx('select'); }
      if (upPressed){ G.initials[G.slot] = (G.initials[G.slot] + 1) % LB_CHARS.length; sfx('select'); }
      if (downPressed){ G.initials[G.slot] = (G.initials[G.slot] + LB_CHARS.length - 1) % LB_CHARS.length; sfx('select'); }
      if (firePressed){
        if (G.slot < 2){ G.slot++; sfx('select'); }
        else { commitScore(); sfx('power'); }
      }
      break;
    case 'LEADERBOARD':
      if (firePressed){ goToTitle(); }
      break;
    case 'BOSS_INTRO':
      updateWorld(dt);
      G.introT -= dt;
      if (G.introT <= 0) spawnBossNow();
      break;
    case 'PLAYING':
      updateWorld(dt);
      if (G.state !== 'PLAYING') break;
      if (G.mode === 'swarm'){
        updateSwarm(dt);
      } else if (!G.bossActive){
        if (G.stageScore >= bossThreshold(G.cfg)) startBossIntro();   // BATTLE MATH #4: 1.6x longer stages
        else {
          G.spawnTimer -= dt;
          if (G.spawnTimer <= 0){ spawnEnemy(); G.spawnTimer = G.cfg.spawn_interval; }
          G.waveTimer -= dt;
          if (G.waveTimer <= 0){ spawnScoutWave(); G.waveTimer = 6.5 + Math.random()*2; }
          G.bomberTimer -= dt;
          if (G.bomberTimer <= 0){ spawnBomberWave(); G.bomberTimer = 10 + Math.random()*3; }
        }
      }
      break;
  }
}
function resetRun(){
  G.stageIndex = 0;
  G.cfg = STAGES[0];
  G.paused = false;
  G.stageScore = 0; G.totalScore = 0;
  G.enemies.length = 0; G.eBullets.length = 0; G.pBullets.length = 0;
  G.powerups.length = 0; G.particles.length = 0;

  G.bannerVisible = false;
  G.playerVisible = false;
  G.playerAlive = true;
  music('main');
}

}

}

function updateSwarm(dt){

  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0){ spawnEnemy(); G.spawnTimer = Math.max(0.25, G.cfg.spawn_interval * speedup); }

  if (G.waveTimer <= 0){ spawnScoutWave(); G.waveTimer = Math.max(3, (6.5 + Math.random()*2) * speedup); }
  G.bomberTimer -= dt;
  if (G.bomberTimer <= 0){ spawnBomberWave(); G.bomberTimer = Math.max(5, (10 + Math.random()*3) * speedup); }
}

/* ============================== LEADERBOARD (local now, Supabase when configured) ============================== */
const LB_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const MAP_NODES = [  // four acts, three hours each, snaking upward toward dawn
  { x: 100, y: 630 }, { x: 240, y: 600 }, { x: 380, y: 630 },
  { x: 380, y: 500 }, { x: 240, y: 470 }, { x: 100, y: 500 },
  { x: 100, y: 370 }, { x: 240, y: 340 }, { x: 380, y: 370 },
  { x: 380, y: 240 }, { x: 240, y: 210 }, { x: 100, y: 170 },
];
function loadScores(){
  if (!IS_BROWSER) return G._testScores || [];
  try { return JSON.parse(localStorage.getItem('sunder2_scores') || '[]'); } catch(e){ return []; }
}
function saveScoreLocal(entry){
  const list = loadScores();
  list.push(entry);
  list.sort(function(a,b){ return b.score - a.score; });
  const top = list.slice(0, 50);
  if (!IS_BROWSER){ G._testScores = top; return top; }
  try { localStorage.setItem('sunder2_scores', JSON.stringify(top)); } catch(e){}
  return top;
}
function sbConfigured(){ return !!(SUNDER_CONFIG.SUPABASE_URL && SUNDER_CONFIG.SUPABASE_ANON_KEY); }
function sbHeaders(){
  return { 'apikey': SUNDER_CONFIG.SUPABASE_ANON_KEY,
           'Authorization': 'Bearer ' + SUNDER_CONFIG.SUPABASE_ANON_KEY,
           'Content-Type': 'application/json' };
}
function submitScoreRemote(entry){
  if (!IS_BROWSER || !sbConfigured()) return;
  fetch(SUNDER_CONFIG.SUPABASE_URL + '/rest/v1/leaderboard', {
    method: 'POST',
    headers: Object.assign(sbHeaders(), { 'Prefer': 'return=minimal' }),
    body: JSON.stringify(entry)
  }).catch(function(){});
}
function fetchScoresRemote(){
  if (!IS_BROWSER || !sbConfigured()){ G.globalScores = null; return; }
  fetch(SUNDER_CONFIG.SUPABASE_URL + '/rest/v1/leaderboard?select=initials,score,stage,mode&order=score.desc&limit=10',
        { headers: sbHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(rows){ if (Array.isArray(rows)) G.globalScores = rows; })
    .catch(function(){ G.globalScores = null; });
}
function startEnterScore(){
  G.pendingScore = {
    score: G.totalScore,
    stage: G.mode === 'swarm' ? Math.min(9, Math.floor(G.swarmT / 35) + 1) : G.cfg.num,
    mode: G.mode
  };
  G.initials = [0, 0, 0];
  G.slot = 0;
  G.state = 'ENTER_SCORE';
}
function commitScore(){
  const entry = {
    initials: G.initials.map(function(i){ return LB_CHARS[i]; }).join(''),
    score: G.pendingScore.score,
    stage: G.pendingScore.stage,
    mode: G.pendingScore.mode
  };
  saveScoreLocal(entry);
  submitScoreRemote(entry);
  fetchScoresRemote();
  G.state = 'LEADERBOARD';
}

/* ============================== RENDER ============================== */
let canvas = null, ctx = null;
function drawSprite(key, x, y, tint, flash, alpha, scale){
  const base = tint ? tintedSprite(key, tint) : IMGS[key];
  if (!base) return;
  const w = base.width || base.naturalWidth, h = base.height || base.naturalHeight;
  if (!w) return;
  const sc = scale || 1;
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.drawImage(base, -w/2, -h/2);
  if (flash && flash > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(flash*8, 0.9);
    ctx.drawImage(base, -w/2, -h/2);
  }
  ctx.restore();
}
// Blender ship sprite with an engine glow; falls back to the tinted SVG until the image loads
const SHIP_PX = 84;
function drawShip(ship, x, y, alpha, scale, flashTint){
  if (!artReady(ship.id)){ drawSprite('player', x, y, flashTint || ship.tint, 0, alpha, scale); return; }
  const s = SHIP_PX * (scale || 1);
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.globalCompositeOperation = 'lighter';
  const gy = y + s*0.40, flick = 0.75 + 0.25*Math.sin(G.time*38);
  const eg = ctx.createRadialGradient(x, gy, 1, x, gy, s*0.30*flick);
  eg.addColorStop(0, ship.accent + 'cc'); eg.addColorStop(1, ship.accent + '00');
  ctx.fillStyle = eg;
  ctx.fillRect(x - s*0.4, gy - s*0.4, s*0.8, s*0.8);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(ART[ship.id], x - s/2, y - s/2, s, s);
  if (flashTint){  // form-change flash
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha *= 0.55;
    ctx.drawImage(ART[ship.id], x - s/2, y - s/2, s, s);
  }
  ctx.restore();
}
// Blender Keeper sprites are rendered at 2x; Sobek is long and thin, so it is drawn larger to cover its hitbox
const KEEPER_SCALE = { keeper_sobek: 0.62, keeper_sokar: 0.6 };
function drawKeeper(key, x, y, flash){
  const im = ART[key], k = KEEPER_SCALE[key] || 0.5;
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  ctx.save();
  ctx.translate(x, y + Math.sin(G.time * 1.6) * 3);
  ctx.drawImage(im, -w/2, -h/2, w, h);
  if (flash && flash > 0){                      // hit flash, same feel as the SVG bosses
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(flash * 8, 0.9);
    ctx.drawImage(im, -w/2, -h/2, w, h);
  }
  ctx.restore();
}
function wrapLine(text, maxW){
  if (ctx.measureText(text).width <= maxW) return [text];
  const words = text.split(' ');
  const out = []; let cur = '';
  for (const w2 of words){
    const test = cur ? cur + ' ' + w2 : w2;
    if (ctx.measureText(test).width > maxW && cur){ out.push(cur); cur = w2; }
    else cur = test;
  }
  if (cur) out.push(cur);
  return out;
}
function drawBanner(){
  ctx.save();
  ctx.fillStyle = 'rgba(5,4,12,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const rawLines = G.banner.split('\n');
  const lines = [];
  ctx.font = '15px "Courier New", monospace';
  for (const rl of rawLines){
    if (rl === '') lines.push('');
    else for (const seg of wrapLine(rl, W-56)) lines.push(seg);
  }
  const lh = 21;
  let y = Math.max(46, H/2 - lines.length*lh/2);
  const portrait = G.state === 'BOSS_INTRO' && G.cfg && artReady(G.cfg.art + '_portrait') ? ART[G.cfg.art + '_portrait'] : null;
  if (portrait){
    const ps = 220, py = H/2 - lines.length*lh/2 - ps + 10;
    ctx.globalAlpha = Math.min(1, (2.4 - (G.introT || 0)) * 2 + 0.2);
    const glow = ctx.createRadialGradient(W/2, py + ps/2, 10, W/2, py + ps/2, ps*0.6);
    glow.addColorStop(0, (G.cfg.tint || '#FF3FA4') + '55'); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(W/2 - ps, py - 20, ps*2, ps + 40);
    ctx.drawImage(portrait, W/2 - ps/2, py, ps, ps);
    ctx.globalAlpha = 1;
    y = Math.max(y, py + ps + 18);
  }
  for (let i = 0; i < lines.length; i++){
    const line = lines[i];
    const isTitle = (i < 3 && (G.state === 'OPENING' || G.state === 'VICTORY')) ||
                    (i < 2 && (G.state === 'BRIEFING' || G.state === 'STAGE_CLEAR' ||
                               G.state === 'DEFEAT' || G.state === 'BOSS_INTRO'));
    ctx.font = isTitle ? 'bold 19px "Courier New", monospace' : '15px "Courier New", monospace';
    ctx.fillStyle = isTitle ? '#F4D77B' : '#C9B368';
    if (line.startsWith('[')) ctx.fillStyle = '#8FE3FF';
    ctx.fillText(line, W/2, y);
    y += lh;
  }
  ctx.restore();
}
// SUNDER II title: Blender backdrop + live layers (DESIGN.md §3, screen 1)

function statBar(pct){
  const filled = Math.round(Math.max(0, Math.min(1, pct)) * 10);
  return '█'.repeat(filled) + '░'.repeat(10 - filled);
}

function draw(){
  ctx.save();
  if (G.shake > 0)
    ctx.translate((Math.random()-0.5)*G.shake*18, (Math.random()-0.5)*G.shake*18);
  ctx.fillStyle = '#0a0918';
  ctx.fillRect(-20, -20, W+40, H+40);
  for (const s of stars){
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = s.gold ? '#D4AF37' : '#99BFE6';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (G.state === 'TITLE'){ drawTitle(); ctx.restore(); return; }
  if (G.state === 'SHIP_SELECT'){ drawShipSelect(); ctx.restore(); return; }
  if (G.state === 'MAP'){ drawMap(); ctx.restore(); return; }
  if (G.state === 'ENTER_SCORE'){ drawEnterScore(); ctx.restore(); return; }
  if (G.state === 'LEADERBOARD'){ drawLeaderboard(); ctx.restore(); return; }

  // powerups
  for (const u of G.powerups){
    const sc = 1 + Math.sin(u.y*0.1)*0.12;
    const im = IMGS['powerup_' + u.kind];
    if (im && im.complete && im.naturalWidth){
      ctx.save();
      ctx.translate(u.x, u.y); ctx.scale(sc, sc);
      ctx.drawImage(im, -14, -14);
      ctx.restore();
    }
  }
  // enemies (bombers render larger, scouts slightly smaller)
  for (const e of G.enemies) drawSprite('enemy', e.x, e.y, G.cfg.tint, e.flash, undefined, e.scale || 1);
  // boss — unique story-matched flagship per stage (Taharqa thru the Crystal Overlord)
  if (G.boss){
    if (artReady(G.cfg.art)) drawKeeper(G.cfg.art, G.boss.x, G.boss.y, G.boss.flash);
    else {
      const bkey = IMGS[G.cfg.art] ? G.cfg.art : 'boss';
      drawSprite(bkey, G.boss.x, G.boss.y, null, G.boss.flash, undefined, G.cfg.num === 12 ? 1.25 : 1);
    }
  }
  // player bullets
  for (const p of G.pBullets){
    const im = IMGS.player_bullet;
    if (im && im.complete && im.naturalWidth){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI/2);
      ctx.scale(p.scale, p.scale);
      if (p.color === 'blue') ctx.filter = 'hue-rotate(160deg) saturate(1.4)';
      ctx.drawImage(im, -5, -12);
      ctx.restore();
    }
  }
  // enemy bullets
  const eb = IMGS.enemy_bullet;
  for (const b of G.eBullets){
    if (eb && eb.complete && eb.naturalWidth) ctx.drawImage(eb, b.x-6, b.y-6);
    else { ctx.fillStyle = '#9B30D6'; ctx.beginPath(); ctx.arc(b.x, b.y, 5.5, 0, TAU); ctx.fill(); }
  }
  // player (ship tint + form scale + accent lerp flash)
  if (G.playerVisible && G.playerAlive){
    const p = G.player;
    const blink = p.inv && (Math.floor(p.invT/0.07) % 2 === 0);
    const sc = p.ship.form_scale[Math.min(p.power-1, p.ship.form_scale.length-1)] *
               (p.formFlash > 0 ? 1 + p.formFlash*0.6 : 1);
    const tint = p.formFlash > 0 ? p.ship.accent : p.ship.tint;
    drawShip(p.ship, p.x, p.y, blink ? 0.25 : 1, sc, p.formFlash > 0 ? tint : null);
    if (p.shield > 0){
      ctx.save();
      ctx.globalAlpha = 0.22 + 0.1*Math.sin(G.time*5) + p.shield*0.06;
      ctx.strokeStyle = '#8FE3FF';
      ctx.lineWidth = 2 + p.shield;
      ctx.beginPath(); ctx.arc(p.x, p.y, 40, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }
  // particles
  for (const pt of G.particles){
    ctx.globalAlpha = Math.max(0, 1 - pt.t/pt.life);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHUD();
  if (G.bannerVisible) drawBanner();

  if (IS_BROWSER && hasTouch && G.playerAlive && !G.paused &&
      (G.state === 'PLAYING' || G.state === 'BOSS_INTRO')){
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#122';
    ctx.beginPath(); ctx.arc(bombBtn.x, bombBtn.y, bombBtn.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8FE3FF'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#8FE3FF';
    ctx.font = 'bold 22px serif'; ctx.textAlign = 'center';
    ctx.fillText('☥', bombBtn.x, bombBtn.y+8);
    // pause button
    ctx.fillStyle = '#122';
    ctx.beginPath(); ctx.arc(pauseBtn.x, pauseBtn.y, pauseBtn.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#D4AF37'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#F4D77B';
    ctx.fillRect(pauseBtn.x-6, pauseBtn.y-7, 4, 14);
    ctx.fillRect(pauseBtn.x+2, pauseBtn.y-7, 4, 14);
    ctx.restore();
  }
  // pause overlay
  if (G.paused){
    ctx.save();
    ctx.fillStyle = 'rgba(5,4,12,0.74)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px "Courier New", monospace';
    ctx.fillStyle = '#F4D77B';
    ctx.fillText('PAUSED', W/2, H/2 - 34);
    ctx.font = '15px "Courier New", monospace';
    ctx.fillStyle = '#8FE3FF';
    ctx.fillText('P / SPACE / tap — resume', W/2, H/2 + 10);
    ctx.fillStyle = '#C9B368';
    ctx.fillText('ESC — quit to ship select', W/2, H/2 + 38);
    ctx.restore();
  }
}

/* ============================== BOOT (browser only) ============================== */
let hasTouch = false;
if (IS_BROWSER){
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  function fit(){
    const scale = Math.min(window.innerWidth/W, (window.innerHeight-30)/H);
    canvas.style.width = Math.floor(W*scale) + 'px';
    canvas.style.height = Math.floor(H*scale) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  const KEYMAP = {
    'ArrowLeft':'left','KeyA':'left','ArrowRight':'right','KeyD':'right',
    'ArrowUp':'up','KeyW':'up','ArrowDown':'down','KeyS':'down',
    'Space':'fire','KeyX':'bomb','KeyM':'muteToggle','KeyP':'pauseToggle','KeyL':'lead'
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'Escape'){
      if (G.paused){ goToHangar(); }
      else if (G.state === 'DEFEAT') goToHangar();                          // change ship after defeat
      else if (G.state === 'OPENING') goToHangar();                         // change ship before the run starts
      else if (G.state === 'BRIEFING' && G.stageIndex === 0) goToHangar();  // still allowed before stage 1
      else if (G.state === 'VICTORY' || G.state === 'SHIP_SELECT') goToTitle();
      e.preventDefault(); return;
    }
    const k = KEYMAP[e.code];
    if (k){ input[k] = true; e.preventDefault(); ac(); }
  });
  window.addEventListener('keyup', e => {
    const k = KEYMAP[e.code];
    if (k){ input[k] = false; e.preventDefault(); }
  });
  // auto-pause when the tab/window loses focus mid-combat
  window.addEventListener('blur', () => {
    if (G.state === 'PLAYING' || G.state === 'BOSS_INTRO') G.paused = true;
  });

  let lastTouch = null;
  function canvasPos(t){
    const r = canvas.getBoundingClientRect();
    return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height };
  }
  function pulse(key){
    input[key] = true;
    touchPulse.push(key);   // released by the engine after exactly one frame
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault(); ac();
    const p = canvasPos(e.changedTouches[0]);
    if (G.state === 'SHIP_SELECT'){
      // explicit buttons only — tapping anywhere else does nothing
      if (Math.hypot(p.x-selLeftBtn.x, p.y-selLeftBtn.y) < selLeftBtn.r + 12) pulse('left');
      else if (Math.hypot(p.x-selRightBtn.x, p.y-selRightBtn.y) < selRightBtn.r + 12) pulse('right');
      else if (p.x >= storyBtn.x && p.x <= storyBtn.x + storyBtn.w && p.y >= storyBtn.y - 6 && p.y <= storyBtn.y + storyBtn.h + 6){
        if (G.modeSel !== 0){ G.modeSel = 0; sfx('select'); }
      }
      else if (p.x >= swarmBtn.x && p.x <= swarmBtn.x + swarmBtn.w && p.y >= swarmBtn.y - 6 && p.y <= swarmBtn.y + swarmBtn.h + 6){
        if (G.modeSel !== 1){ G.modeSel = 1; sfx('select'); }
      }
      else if (p.x >= launchBtn.x - 10 && p.x <= launchBtn.x + launchBtn.w + 10 &&
               p.y >= launchBtn.y - 10 && p.y <= launchBtn.y + launchBtn.h + 10) pulse('fire');
      return;
    }
    if (G.state === 'MAP'){
      const n = MAP_NODES[G.nextStage];
      if (Math.hypot(p.x-n.x, p.y-n.y) < 34 || p.y > H - 60) pulse('fire');   // marked node or bottom bar
      return;
    }
    if (G.state === 'ENTER_SCORE'){
      for (let i = 0; i < 3; i++){
        const x = W/2 + (i-1)*80;
        if (p.x > x-34 && p.x < x+34 && p.y > 250 && p.y < 400){
          G.slot = i;
          G.initials[i] = p.y < 340
            ? (G.initials[i] + 1) % LB_CHARS.length
            : (G.initials[i] + LB_CHARS.length - 1) % LB_CHARS.length;
          sfx('select');
          return;
        }
      }
      if (p.x > W/2-100 && p.x < W/2+100 && p.y > 480 && p.y < 546){ commitScore(); sfx('power'); }
      return;
    }
    if (G.state === 'LEADERBOARD'){ pulse('fire'); return; }
    if (G.state === 'TITLE' && p.y > TITLE_LB_Y - 26 && p.y < TITLE_LB_Y + 22){ pulse('lead'); return; }
    if (G.state === 'PLAYING' || G.state === 'BOSS_INTRO'){
      if (G.paused){ G.paused = false; return; }                       // tap anywhere resumes
      if (Math.hypot(p.x-pauseBtn.x, p.y-pauseBtn.y) < pauseBtn.r + 10){
        G.paused = true; return;                                       // tap ⏸ pauses
      }
      if (Math.hypot(p.x-bombBtn.x, p.y-bombBtn.y) < bombBtn.r + 12){
        pulse('bomb');
        return;
      }
      input.touchActive = true;
      lastTouch = p;
    } else if (G.state === 'DEFEAT' && p.y < 100){
      startEnterScore();                                               // tap top = record score
    } else if (G.state === 'DEFEAT' && p.y > H - 100){
      goToHangar();                                                    // tap bottom = change ship
    } else if (G.state === 'OPENING' && p.y > H - 100 && p.x < W/2){
      goToHangar();                                                    // tap lower-left = change ship
    } else {
      pulse('fire');
    }
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!input.touchActive || !lastTouch) return;
    const p = canvasPos(e.changedTouches[0]);
    input.touchDX += (p.x - lastTouch.x) * 1.25;
    input.touchDY += (p.y - lastTouch.y) * 1.25;
    lastTouch = p;
  }, {passive:false});
  const endTouch = e => { e.preventDefault(); input.touchActive = false; lastTouch = null; };
  canvas.addEventListener('touchend', endTouch, {passive:false});
  canvas.addEventListener('touchcancel', endTouch, {passive:false});

  resetGame();
  window.__G = G;   // read-only debug handles for live verification
  window.__input = input;
  try {
    if (new URLSearchParams(location.search).get('mode') === 'swarm') G.modeSel = 1;
  } catch(e){}
  fetchScoresRemote();
  let last = performance.now();
  function loop(now){
    let dt = (now - last)/1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
} else {
  resetGame();
}

/* test hook (headless) */
if (!IS_BROWSER && typeof module !== 'undefined' && module.exports){
  module.exports = { G, input, update, resetGame, beginStage, startPlaying, launchCampaign,
    bossTakeDamage, playerTakeDamage, spawnEnemy, spawnEnemyAt, spawnScoutWave, spawnBomberWave,
    useBomb, collectPowerup, goToTitle, goToHangar, startSwarm, startEnterScore, commitScore,
    loadScores, bossThreshold, SUNDER_CONFIG, INTERLUDES, LB_CHARS, SVGS, SHIPS, STAGES, W, H };
}
</script>
