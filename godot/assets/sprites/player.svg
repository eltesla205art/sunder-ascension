  <!-- Egyptian ankh-eye energy core -->
  <ellipse cx="32" cy="38" rx="6" ry="8" fill="url(#core)"/>
  <ellipse cx="32" cy="38" rx="2.5" ry="4" fill="#DFFCFF"/>

  <!-- Hieroglyphic hull lines -->
