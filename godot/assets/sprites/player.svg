<svg width="64" height="72" viewBox="0 0 64 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4D77B"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8A6D1E"/>
    </linearGradient>
    <linearGradient id="darkgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="1" stop-color="#5A4409"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FE3FF"/>
      <stop offset="0.6" stop-color="#2FA8D8"/>
      <stop offset="1" stop-color="#0B3A54"/>
